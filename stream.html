<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedStream - Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div class="glow-accent accent-1"></div>
  <div class="glow-accent accent-2"></div>

  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="logo-svg">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </span>
        <h1>RedStream</h1>
      </div>

      <nav class="nav-tabs">
        <button class="nav-btn" data-nav="dashboard.html">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span class="nav-label">Explore</span>
        </button>
        <button class="nav-btn active">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <span class="nav-label">Stream</span>
        </button>
        <button class="nav-btn" data-nav="dashboard.html#settings">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span class="nav-label">Einstellungen</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="app-content">
    <section id="tab-stream" class="tab-panel active">
      <div class="stream-layout">
        <aside class="stream-sidebar">
          <div class="sidebar-card">
            <h3>Stream-Nischen</h3>
            <p class="sidebar-help">Wähle aus, aus welchen deiner Nischen Videos im Stream vorgeschlagen werden sollen.</p>
            <div id="stream-niches-list" class="stream-niches-list"></div>
            <button id="stream-reload-btn" class="glow-btn-mini" style="margin-top: 1rem; width: 100%;">Stream neu laden</button>
          </div>
        </aside>

        <div class="stream-viewport-container">
          <div class="stream-video-box">
            <div id="stream-container" class="stream-container"></div>

            <!-- Mobile: floating button to open niche drawer -->
            <button id="stream-mobile-toggle" class="stream-mobile-toggle" title="Nischen auswählen">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="14" y2="12"></line><line x1="4" y1="18" x2="10" y2="18"></line></svg>
            </button>

            <button id="stream-fullscreen-btn" class="stream-fullscreen-btn" title="Vollbild">
              <svg class="fs-expand" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
              <svg class="fs-compress hide" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
            </button>

            <div id="stream-loader" class="stream-loader-overlay hide">
              <div class="spinner"></div>
              <span>Suche neue Videos...</span>
            </div>

            <div id="stream-empty" class="empty-state stream-empty-overlay hide">
              <div class="empty-icon">📺</div>
              <h3>Keine Videos im Stream</h3>
              <p>Bitte wähle mindestens eine Nische links aus oder füge in den Einstellungen Nischen hinzu, um Videos zu laden.</p>
            </div>
          </div>
        </div>

        <!-- Mobile backdrop -->
        <div id="stream-drawer-backdrop" class="stream-drawer-backdrop"></div>
      </div>
    </section>
  </main>

  <script src="stream.js"></script>
</body>
</html>
